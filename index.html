<title>再见老师 · 台词滚动</title>
<style>
  :root{
    --bg:#f4eee2; --bg2:#eae1cf; --panel:rgba(255,255,255,.62);
    --ink:#231e19; --ink2:#5d5347; --dim:#b3a691; --pending:#7a6e5c; --done:#9c9081;
    --hl:#a82b1e; --hl2:#c4553f; --gold:#b98a2f; --line:rgba(35,30,25,.10);

    --sp1:#a82b1e; --sp2:#1f6fb2; --sp3:#2e7d5b; --sp4:#8a5a00;

    --ink:#ece3d4; --ink2:#a89c8b; --dim:#4a423a; --pending:#8f8474; --done:#6b6154;
    --hl:#e2603f; --hl2:#f08a6a; --gold:#c9a227; --line:rgba(255,255,255,.08);

  *{box-sizing:border-box}
  html,body{height:100%}
  body{

  }
  /* 宣纸纹理 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;

  .brand{display:flex; align-items:baseline; gap:10px; min-width:0}
  .seal{

    display:grid; place-items:center; font-size:15px; font-weight:700;
    font-family:"STKaiti","KaiTi",serif; box-shadow:0 4px 12px -4px var(--hl);
    flex:0 0 auto;
  }
  .title{font-size:15px; font-weight:600; letter-spacing:.02em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .sub{font-size:11.5px; color:var(--ink2); font-family:"Inter","Segoe UI",system-ui,sans-serif;
    letter-spacing:.04em}
  header .spacer{flex:1}
  .tools{display:flex; align-items:center; gap:8px}
  .btn{

    color:var(--ink); border-radius:10px; padding:7px 12px; cursor:pointer;
    font-size:12.5px; font-family:"Inter","Segoe UI",system-ui,sans-serif;
    transition:.18s ease; backdrop-filter:blur(8px); white-space:nowrap;
  }
  .btn:hover{border-color:var(--hl); color:var(--hl); transform:translateY(-1px)}
  .btn.on{background:var(--hl); border-color:var(--hl); color:#fff}
  .seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    background:var(--panel); backdrop-filter:blur(8px)}
  .seg button{
    appearance:none; border:0; background:transparent; color:var(--ink2); cursor:pointer;
    padding:7px 11px; font-size:12.5px; font-family:"Inter","Segoe UI",system-ui,sans-serif;
    transition:.18s;
  }
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--hl); color:#fff}

  .stage{position:relative; flex:1 1 auto; overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 84%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 84%,transparent 100%);

  .lyrics{
    position:absolute; left:0; right:0; top:0;
    padding:32vh 0 46vh;

    will-change:transform;
  }
  .line{
    max-width:min(880px,86vw); margin:0 auto; padding:14px 26px 18px;
    cursor:pointer; opacity:.38;
    transition:opacity .45s ease, filter .45s ease, transform .45s ease;
    transform:scale(.965); transform-origin:center left;

  .line:hover{opacity:.6}
  .line.done{opacity:.58}
  .line.active{opacity:1; transform:scale(1);

    -webkit-text-fill-color:transparent; color:transparent;

  .line:not(.active):not(.done) .ch{ background:none; -webkit-text-fill-color:var(--dim); color:var(--dim) }

  .meta{display:flex; align-items:center; gap:10px; margin-top:10px; opacity:.85}

    margin-bottom:6px;
  }

  .line.active .bar i{ background:linear-gradient(90deg,var(--spc,var(--hl)),var(--gold)) }

  @media (max-width:640px){

    .line{padding:10px 16px 14px; max-width:94vw}

  @media print{

    header .tools,footer,.hint{display:none}
    .ch{background:none!important;-webkit-text-fill-color:#000!important;color:#000!important}
  }
</style>
</head>

const LINES = DATA.lines || [];
const TRACKS = DATA.audio || {};
const CAST = DATA.cast || {};

function spColor(name){
  if (!name) return '';
  if (CAST[name]) return CAST[name];
  const first = String(name).split(/[、，/]/)[0].trim();
  return CAST[first] || 'var(--spx)';
}

const elLyrics = document.getElementById('lyrics');
const elStage  = document.getElementById('stage');
const elPlay   = document.getElementById('play');
const elSeek   = document.getElementById('seek');
const elCur    = document.getElementById('cur');
const elDur    = document.getElementById('dur');
const elSub    = document.getElementById('sub');
const elTracks = document.getElementById('tracks');

document.getElementById('ttl').textContent = DATA.title || '台词滚动';
document.getElementById('sub').textContent =
  `${LINES.length} 句 · ${fmt(DATA.duration || 0)} · ${DATA.language || 'zh'}`;

function fmt(t){
  t = Math.max(0, t || 0);
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ─────────── 渲染 ─────────── */
const nodes = [];
LINES.forEach((ln, i) => {
  const d = document.createElement('div');
  d.className = 'line';
  d.dataset.i = i;

  const p = document.createElement('div');
  p.className = 'txt';
  const col = spColor(ln.sp);
  if (col){
    d.style.setProperty('--spc', col);
    d.classList.add('spk-line');
  }
  if (ln.sp && (i === 0 || LINES[i-1].sp !== ln.sp)){
    const s = document.createElement('div');
    s.className = 'spk';
    s.textContent = ln.sp;
    if (col) s.style.color = col;
    d.appendChild(s);
  }
  const chars = [];
  (ln.chars && ln.chars.length ? ln.chars : [...ln.text].map(c => ({c, s: ln.start, e: ln.end})))
    .forEach(ch => {
      const sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = ch.c;
      p.appendChild(sp);
      chars.push({el: sp, s: ch.s, e: ch.e, blank: !ch.c.trim()});
    });

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span class="tc">${ts(ln.start)}</span>
                    <span class="bar"><i></i></span>
                    <span class="num">${String(i+1).padStart(2,'0')}</span>`;

  d.appendChild(p); d.appendChild(meta);
  d.addEventListener('click', () => seekTo(ln.start + 0.001));
  elLyrics.appendChild(d);
  nodes.push({el: d, bar: meta.querySelector('.bar i'), chars, line: ln, top: 0});
});

function ts(t){
  const m = Math.floor(t/60), s = (t%60);
  return `${String(m).padStart(2,'0')}:${s.toFixed(2).padStart(5,'0')}`;
}

function measure(){
  nodes.forEach(n => { n.top = n.el.offsetTop + n.el.offsetHeight * 0.5; });
}
window.addEventListener('resize', () => { measure(); layout(true); });

/* ─────────── 音频 ─────────── */
const audio = new Audio();
audio.preload = 'metadata';
let useVirtual = !Object.keys(TRACKS).length;
let vtime = 0, vplaying = false, vlast = 0;
let trackKey = null;
let playing = false;

function trackList(){
  const order = ['full','vocals','instrumental'];
  const label = {full:'原声', vocals:'人声', instrumental:'伴奏'};
  return order.filter(k => TRACKS[k]).map(k => ({k, label: label[k] || k}));
}
const TL = trackList();
if (TL.length){
  trackKey = TL[0].k;
  audio.src = TRACKS[trackKey];
  TL.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.k = t.k;
    if (i === 0) b.classList.add('on');
    b.onclick = () => switchTrack(t.k);
    elTracks.appendChild(b);
  });
  if (TL.length > 1) elTracks.hidden = false;
} else {
  useVirtual = true;
  elSub.textContent += ' · 无音轨（滚动预览）';
}

function switchTrack(k){
  if (!TRACKS[k] || k === trackKey) return;
  const t = useVirtual ? vtime : audio.currentTime;
  const wasPlaying = playing;
  trackKey = k;
  audio.src = TRACKS[k];
  audio.addEventListener('loadedmetadata', () => {
    audio.currentTime = Math.min(t, (audio.duration || t) - 0.05);
    if (wasPlaying) audio.play().catch(()=>{});
  }, {once:true});
  [...elTracks.children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
}

audio.addEventListener('loadedmetadata', () => {
  elDur.textContent = fmt(audio.duration || DATA.duration);
  elSeek.max = (audio.duration || DATA.duration).toFixed(2);
});
audio.addEventListener('ended', () => setPlaying(false));

/* ─────────── 播放控制 ─────────── */
function now(){
  if (useVirtual){
    if (vplaying){
      const t = performance.now();
      vtime += (t - vlast) / 1000;
      vlast = t;
    }
    return Math.min(vtime, DATA.duration || vtime);
  }
  return audio.currentTime;
}

function setPlaying(v){
  playing = v;
  document.getElementById('ic-play').style.display  = v ? 'none' : 'block';
  document.getElementById('ic-pause').style.display = v ? 'block' : 'none';
  if (useVirtual){ vplaying = v; vlast = performance.now(); }
  else { v ? audio.play().catch(()=>{}) : audio.pause(); }
  if (v) document.getElementById('hint').classList.add('hide');
}

elPlay.onclick = () => setPlaying(!playing);

function seekTo(t){
  t = Math.max(0, Math.min(t, (useVirtual ? DATA.duration : audio.duration) || DATA.duration));
  if (useVirtual) vtime = t; else audio.currentTime = t;
  render(t);
}

elSeek.addEventListener('input', e => seekTo(parseFloat(e.target.value)));

document.getElementById('speed').onclick = e => {
  const seq = [1, 1.25, 1.5, 0.75, 0.5];
  const cur = audio.playbackRate || 1;
  const next = seq[(seq.indexOf(cur) + 1) % seq.length] || 1;
  audio.playbackRate = next;
  e.target.textContent = next.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×';
};

document.getElementById('theme').onclick = e => {
  const html = document.documentElement;
  const ink = html.dataset.theme === 'ink';
  html.dataset.theme = ink ? 'paper' : 'ink';
  e.target.textContent = ink ? '墨' : '纸';
};

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight'){ seekTo(now() + 5); }
  else if (e.code === 'ArrowLeft'){ seekTo(now() - 5); }
  else if (e.code === 'ArrowDown'){ jumpLine(1); }
  else if (e.code === 'ArrowUp'){ jumpLine(-1); }
  else if (/^Digit[1-3]$/.test(e.code)){
    const k = TL[parseInt(e.code.slice(5), 10) - 1];
    if (k) switchTrack(k.k);
  }
});

let activeIdx = -1;
function jumpLine(d){
  const i = Math.max(0, Math.min(LINES.length - 1, (activeIdx < 0 ? 0 : activeIdx) + d));
  if (LINES[i]) seekTo(LINES[i].start + 0.001);
}

/* ─────────── 核心：逐字高亮 + 每句进度条 + 自动滚动 ─────────── */
function findIndex(t){
  let lo = 0, hi = LINES.length - 1, ans = -1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (LINES[mid].start <= t){ ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function layout(force){
  if (activeIdx < 0 || !nodes[activeIdx]) return;
  const n = nodes[activeIdx];
  const target = elStage.clientHeight * 0.40 - n.top;
  if (force || Math.abs(target - layout.last) > 1){
    elLyrics.style.transform = `translate3d(0, ${target}px, 0)`;
    layout.last = target;
  }
}
layout.last = null;

function render(t){
  elCur.textContent = fmt(t);
  if (!elSeek.matches(':active')) elSeek.value = Math.min(t, parseFloat(elSeek.max) || t);

  const idx = findIndex(t);
  if (idx !== activeIdx){
    nodes.forEach((n, i) => {
      n.el.classList.toggle('active', i === idx);
      n.el.classList.toggle('done', i < idx);
      if (i !== idx){ n.bar.style.width = i < idx ? '100%' : '0%'; }
    });
    activeIdx = idx;
    layout(true);
  }

  if (idx >= 0){
    const n = nodes[idx];
    const ln = LINES[idx];
    const p = Math.max(0, Math.min(1, (t - ln.start) / Math.max(0.001, ln.end - ln.start)));
    n.bar.style.width = (p * 100).toFixed(2) + '%';
    for (const c of n.chars){
      if (c.blank) continue;
      let q;
      if (t <= c.s) q = 0;
      else if (t >= c.e) q = 100;
      else q = ((t - c.s) / Math.max(0.001, c.e - c.s)) * 100;
      c.el.style.setProperty('--p', q.toFixed(1) + '%');
    }
  }
}

function loop(){
  render(now());
  requestAnimationFrame(loop);
}

/* 链接 */
const links = document.getElementById('links');
(DATA.links || []).forEach(l => {
  const a = document.createElement('a');
  a.href = l.href; a.textContent = l.label; a.download = '';
  links.appendChild(a);
});

measure();
if (LINES.length){
  activeIdx = -1;
  // 深链：#t=12.5 直接定位到该秒数
  const m = /t=([\d.]+)/.exec(location.hash || '');
  const t0 = m ? parseFloat(m[1]) : 0;
  if (t0 > 0){
    if (useVirtual) vtime = t0;
    else audio.addEventListener('loadedmetadata', () => { audio.currentTime = t0; render(t0); }, {once:true});
  }
  render(t0);
  layout(true);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
